name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: [self-hosted, linux, fedresearch-dict]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip` — this job runs on a self-hosted runner whose `_work`
          # dir is a symlink onto the extra volume (disk-remediation 2026-06-16).
          # setup-python's cache runs hashFiles('**/requirements.txt',
          # '**/pyproject.toml') which fails to match through the symlinked work
          # dir → "No file matched … checked out the target repository" → the
          # Set-up-Python step fails. The host has a warm ~/.cache/pip, so the
          # actions cache is redundant here. Matches fedresearch-scraper #588.

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run pytest
        run: pytest -q

  build-wheel:
    runs-on: [self-hosted, linux, fedresearch-dict]
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Compute wheel SHA-256 (matches Dockerfile pinning contract)
        run: |
          cd dist
          for f in *.whl; do
            echo "$f: $(sha256sum "$f" | awk '{print $1}')"
          done
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 14
