name: CI

env:
  # Pinned: an unpinned installer script is a moving dependency on every CI run.
  UV_VERSION: "0.9.28"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rot detector, not a build. This repo is low-traffic: between 2026-06-20 and
  # 2026-08-09 nothing triggered CI at all, and in that window the runner host moved
  # to Debian 13 and broke `actions/setup-python` for every job here. The breakage was
  # invisible for seven weeks and surfaced on an unrelated docs PR, which is the worst
  # time to discover it — a green history means nothing if nothing ran.
  #
  # A weekly tick turns "silent rot" into "a failing scheduled run within 7 days".
  # It also keeps this runner's uv interpreter cache warm, so the first PR of the
  # month doesn't pay the cold download.
  #
  # NOTE ON NOTIFICATION: a failing scheduled run relies on GitHub's default email to
  # the user who last touched this workflow file. That is weak. Cross-repo CI-staleness
  # monitoring on the ops alert bus is the fuller answer and is deliberately not
  # attempted here.
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC — off the hour, away from the nightly producer window
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: [self-hosted, linux, fedresearch-dict]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # NOT actions/setup-python. The runner host moved to Debian 13 (trixie), and
      # actions/python-versions publishes no x64 builds for it, so setup-python fails
      # at "The version '3.11' with architecture 'x64' was not found for Debian 13"
      # before lint or tests ever run. Trixie itself ships only 3.13, and 3.11/3.12
      # are not in its archive, so there is no apt path either. uv provisions its own
      # standalone interpreters, which is what makes the declared support matrix
      # (requires-python >=3.11; classifiers 3.11 + 3.12) testable on this host at all.
      #
      # `--seed` is load-bearing: a bare `uv venv` creates no pip, and the steps below
      # call `python -m pip`. Prepending .venv/bin to GITHUB_PATH keeps those steps
      # unchanged, so this swap is confined to interpreter provisioning.
      #
      # No `cache: pip` concerns carry over — uv caches interpreters under
      # ~/.local/share/uv and wheels under ~/.cache/uv, both outside the symlinked
      # `_work` dir that broke setup-python's hashFiles cache (fedresearch-scraper #588).
      - name: Set up Python ${{ matrix.python-version }} (uv)
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install "${{ matrix.python-version }}"
          uv venv --seed --python "${{ matrix.python-version }}" .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify the interpreter is the one the matrix asked for
        run: |
          python -c "import sys; v='%d.%d'%sys.version_info[:2]; want='${{ matrix.python-version }}'; print('running',v,'want',want); sys.exit(0 if v==want else 1)"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run pytest
        run: pytest -q

  build-wheel:
    runs-on: [self-hosted, linux, fedresearch-dict]
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      # Same Debian 13 constraint as lint-and-test above.
      - name: Set up Python 3.11 (uv)
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.11
          uv venv --seed --python 3.11 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Compute wheel SHA-256 (matches Dockerfile pinning contract)
        run: |
          cd dist
          for f in *.whl; do
            echo "$f: $(sha256sum "$f" | awk '{print $1}')"
          done
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 14
